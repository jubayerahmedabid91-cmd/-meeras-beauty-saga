# Netlify configuration for Meera's - The Beauty Saga
# The official Netlify Next.js plugin handles static assets (_next/static),
# public/ images, SSR routes and rewrites.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  # better-sqlite3 is a native addon. The prebuilt binary shipped in the
  # function bundle was built for a different Node ABI and fails with
  # "Module did not self-register", so compile it from source for the
  # runtime that will actually load it.
  NPM_CONFIG_BUILD_FROM_SOURCE = "true"
  npm_config_build_from_source = "true"
  # Rebuild better-sqlite3 during the build so its native addon matches the
  # Node ABI of the function runtime.
  REBUILD_NATIVE_DEPS = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cache immutable static assets aggressively
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Correct MIME types for assets
[[headers]]
  for = "/_next/static/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/_next/static/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/_next/static/*.woff2"
  [headers.values]
    Content-Type = "font/woff2"
    Cache-Control = "public, max-age=31536000, immutable"
