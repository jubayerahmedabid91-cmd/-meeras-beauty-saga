# Netlify configuration for Meera's - The Beauty Saga
# The official Netlify Next.js plugin handles static assets (_next/static),
# public/ images, SSR routes and rewrites.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  # PostgreSQL runs through the pure-JS `pg` driver, so no native addon has to
  # be compiled for the function runtime.
  #
  # DATABASE_URL is intentionally NOT stored here: set it in the Netlify UI
  # (Site settings -> Environment variables) so the credentials stay out of git.

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cache immutable static assets aggressively
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Correct MIME types for assets
[[headers]]
  for = "/_next/static/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/_next/static/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/_next/static/*.woff2"
  [headers.values]
    Content-Type = "font/woff2"
    Cache-Control = "public, max-age=31536000, immutable"
